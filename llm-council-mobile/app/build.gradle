plugins {
    id 'com.android.application'
}

android {
    namespace 'com.llmcouncil.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.llmcouncil.mobile'
        minSdk 26
        targetSdk 28
        versionCode 3
        versionName '1.2-install-fix'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
