name: Temporary LLM Council Android v3 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'llm-council-mobile/**'
      - '.github/workflows/tmp-llm-council-v3-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle -p llm-council-mobile --no-daemon assembleRelease
      - name: Verify APK
        run: test -s llm-council-mobile/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LLM-Council-Mobile-v3-unsigned
          path: llm-council-mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
