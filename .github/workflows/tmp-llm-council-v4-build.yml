name: Temporary LLM Council Android v4 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'llm-council-mobile/**'
      - '.github/workflows/tmp-llm-council-v4-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v4 unsigned release APK
        run: gradle -p llm-council-mobile --no-daemon assembleRelease
      - name: Collect Android signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner
      - name: Verify build output
        run: test -s llm-council-mobile/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LLM-Council-Mobile-v4-build
          path: |
            llm-council-mobile/app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/**
          retention-days: 7
