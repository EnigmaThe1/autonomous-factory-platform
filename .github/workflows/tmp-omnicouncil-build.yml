name: Temporary OmniCouncil Android Build

on:
  push:
    branches:
      - tmp-omnicouncil-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: llm-council-mobile
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniCouncil-unsigned-release
          path: llm-council-mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
